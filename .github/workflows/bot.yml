name: Test VPNifi Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpnifi-bot-test
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      PAYMENT_CARD: ${{ secrets.PAYMENT_CARD }}
      CARD_OWNER: ${{ secrets.CARD_OWNER }}
      SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run smoke tests
        run: python tests/smoke.py

      - name: Start Telegram bot
        run: |
          python -u main.py &
          BOT_PID=$!

          echo "Bot process started with PID: $BOT_PID"

          sleep 20

          if ! kill -0 "$BOT_PID" 2>/dev/null; then
            echo "ERROR: Bot process exited during startup."
            wait "$BOT_PID"
            exit 1
          fi

          echo "Bot process is still running."

          kill "$BOT_PID"
          wait "$BOT_PID" || true
