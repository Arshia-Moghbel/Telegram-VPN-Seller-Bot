name: For Test VPNifi Bot

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long the bot should stay online"
        required: true
        default: "15"
        type: choice
        options:
          - "5"
          - "15"
          - "30"

permissions:
  contents: read

concurrency:
  group: temporary-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      DATABASE_URL: sqlite+aiosqlite:///vpnifi.db
      LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
      PAYMENT_CARD: ${{ secrets.PAYMENT_CARD }}
      CARD_OWNER: ${{ secrets.CARD_OWNER }}
      SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}
      INSTANCE_LOCK_PATH: .vpnifi.lock
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Telegram credentials
        run: python -m scripts.healthcheck

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run bot for selected duration
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set +e

          timeout \
            --signal=SIGINT \
            --kill-after=30s \
            "${DURATION_MINUTES}m" \
            python -u main.py

          exit_code=$?

          if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 130 ]; then
            echo "Bot stopped after the selected duration."
            exit 0
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "ERROR: Bot exited with code $exit_code"
            exit "$exit_code"
          fi

          echo "Bot exited normally."